[project]
name = "langchain-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pratham Agrawal", email = "agrawalpratham2706@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.31.0",
    "langchain>=1.3.14",
    "langchain-community>=0.3.31",
    "langchain-google-genai>=2.1.12",
    "langchain-groq>=0.3.8",
    "langchain-openai>=0.3.35",
    "python-dotenv>=1.2.1",
]

[project.scripts]
langchain-project = "langchain_project:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
